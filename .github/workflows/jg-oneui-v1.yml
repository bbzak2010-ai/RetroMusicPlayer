                  android:layout_height="52dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

      - name: Adjust OneUI dimensions
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/res/values/dimens.xml")
          s = p.read_text()

          s = s.replace(
              '<dimen name="mini_player_height">56dp</dimen>',
              '<dimen name="mini_player_height">72dp</dimen>'
          )

          s = s.replace(
              '<dimen name="bottom_nav_mini_player_height">136dp</dimen>',
              '<dimen name="bottom_nav_mini_player_height">152dp</dimen>'
          )

          p.write_text(s)
          PY

      - name: Build JG Music OneUI APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JGMusic-OneUI-v1-APK
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk