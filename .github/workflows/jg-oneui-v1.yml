name: Build JG Music OneUI v1

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add Pinyin sort engine
        run: |
          cat > app/src/main/java/code/name/monkey/retromusic/util/PinyinSort.kt <<'EOF'
          package code.name.monkey.retromusic.util

          import android.icu.text.Transliterator
          import android.os.Build
          import java.util.Locale

          object PinyinSort {

              private val transliterator: Transliterator? by lazy {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      Transliterator.getInstance("Han-Latin; Latin-ASCII")
                  } else {
                      null
                  }
              }

              fun key(value: String?): String {
                  val input = value.orEmpty().trim()
                  if (input.isEmpty()) return ""

                  val converted =
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          transliterator?.transliterate(input) ?: input
                      } else {
                          input
                      }

                  return converted
                      .trim()
                      .lowercase(Locale.ROOT)
              }

              fun sectionName(
                  value: String?,
                  stripPrefix: Boolean = false
              ): String {
                  var input = value.orEmpty().trim()

                  if (stripPrefix) {
                      val lower = input.lowercase(Locale.ROOT)

                      input = when {
                          lower.startsWith("the ") -> input.substring(4)
                          lower.startsWith("a ") -> input.substring(2)
                          else -> input
                      }
                  }

                  val sortKey = key(input)

                  val first = sortKey.firstOrNull {
                      it.isLetterOrDigit()
                  } ?: return "#"

                  return when (first) {
                      in 'a'..'z' ->
                          first.uppercaseChar().toString()
                      in 'A'..'Z' ->
                          first.toString()
                      else -> "#"
                  }
              }
          }
          EOF

      - name: Patch Pinyin sorting
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/code/name/monkey/retromusic/repository/SongRepository.kt"
          )

          s = path.read_text()

          marker = "import code.name.monkey.retromusic.util.PreferenceUtil\n"

          if "import code.name.monkey.retromusic.util.PinyinSort" not in s:
              s = s.replace(
                  marker,
                  marker + "import code.name.monkey.retromusic.util.PinyinSort\n"
              )

          replacements = {
              "collator.compare(s1.title, s2.title)":
                  "collator.compare(PinyinSort.key(s1.title), PinyinSort.key(s2.title))",

              "collator.compare(s2.title, s1.title)":
                  "collator.compare(PinyinSort.key(s2.title), PinyinSort.key(s1.title))",

              "collator.compare(s1.albumName, s2.albumName)":
                  "collator.compare(PinyinSort.key(s1.albumName), PinyinSort.key(s2.albumName))",

              "collator.compare(s1.albumArtist, s2.albumArtist)":
                  "collator.compare(PinyinSort.key(s1.albumArtist), PinyinSort.key(s2.albumArtist))",

              "collator.compare(s1.artistName, s2.artistName)":
                  "collator.compare(PinyinSort.key(s1.artistName), PinyinSort.key(s2.artistName))",

              "collator.compare(s1.composer, s2.composer)":
                  "collator.compare(PinyinSort.key(s1.composer), PinyinSort.key(s2.composer))",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          path.write_text(s)

          path = Path(
              "app/src/main/java/code/name/monkey/retromusic/util/MusicUtil.kt"
          )

          s = path.read_text()

          start = s.index("    fun getSectionName(")
          end = s.index("\n    fun getSongCountString", start)

          replacement = """    fun getSectionName(
              mediaTitle: String?,
              stripPrefix: Boolean = false
          ): String {
              return PinyinSort.sectionName(
                  mediaTitle,
                  stripPrefix
              )
          }
          """

          s = s[:start] + replacement + s[end:]
          path.write_text(s)

          debug_name = Path(
              "app/src/debug/res/values/donottranslate.xml"
          )

          text = debug_name.read_text()
          text = text.replace(
              "Retro Music-Debug",
              "JG Music"
          )
          debug_name.write_text(text)
          PY

      - name: Patch OneUI mini player logic
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/code/name/monkey/retromusic/fragments/other/MiniPlayerFragment.kt"
          )

          s = p.read_text()

          old = """    fun setUpButtons() {
              if (RetroUtil.isTablet) {
                  binding.actionNext.show()
                  binding.actionPrevious.show()
              } else {
                  binding.actionNext.isVisible = PreferenceUtil.isExtraControls
                  binding.actionPrevious.isVisible = PreferenceUtil.isExtraControls
              }
              binding.actionNext.setOnClickListener(this)
              binding.actionPrevious.setOnClickListener(this)
          }
          """

          new = """    fun setUpButtons() {
              binding.actionNext.show()
              binding.actionPrevious.show()
              binding.actionNext.setOnClickListener(this)
              binding.actionPrevious.setOnClickListener(this)
          }
          """

          s = s.replace(old, new)

          start = s.index("    private fun updateSongTitle() {")
          end = s.index("\n    private fun updateSongCover()", start)

          replacement = """    private fun updateSongTitle() {
              val song = MusicPlayerRemote.currentSong

              binding.miniPlayerTitle.isSelected = true
              binding.miniPlayerArtist.isSelected = true

              binding.miniPlayerTitle.text = song.title

              val formattedArtistName =
                  ArtistSeparator.split(song.artistName)
                      .joinToString(", ")

              binding.miniPlayerArtist.text =
                  formattedArtistName
          }
          """

          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

